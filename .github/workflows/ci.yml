name: CI

on: 
  [push, pull_request]

jobs:
  python:
    strategy:
        matrix:
          service:
            - casino_service
            - identity_service
            - gateway
            - wallet_service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
   
      - name: tests
        run: uv run pytest