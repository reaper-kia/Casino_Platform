[project]
name = "realtime-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reaper-kia", email = "ilakrivin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "casino-platform-contracts",
    "fastapi>=0.139.2",
    "grpcio>=1.83.0",
    "grpcio-health-checking>=1.83.0",
    "protobuf>=7.35.1",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.uv.sources]
casino-platform-contracts = { path = "../../packages/platform_contracts", editable = true }
