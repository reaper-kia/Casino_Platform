[project]
name = "casino-platform-contracts"
version = "0.1.0"
description = "Generated Python gRPC contracts for Casino Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.83.0,<2",
    "protobuf>=7.35.1,<8",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["casino", "identity", "wallet"]